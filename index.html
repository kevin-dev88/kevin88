<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top Up Game</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Style Asli */
    body {
      background: linear-gradient(135deg, #1e2e49 0%, #1e2e49 100%);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }
    
    .game-card {
      transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      border: none;
      border-radius: 15px;
      overflow: hidden;
      background: #3b5b92;
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
    }
    
    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(79, 70, 229, 0.15);
    }
    
    .game-logo {
      height: 100px;
      object-fit: contain;
      transition: 0.3s ease;
      padding: 1rem;
    }
    
    .game-card:hover .game-logo {
      transform: scale(1.1);
    }
    
    .card-body h6 {
      color: #fff;
      font-weight: 600;
      margin: 0;
    }
    
    .modal-content {
      border: none;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(145deg, #3b5b92 0%, #1e2e49 100%);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      color: white;
    }
    
    .modal-header {
      border-bottom: none;
      background: linear-gradient(135deg, #3b5b92 0%, #3b5b92 100%);
      color: white;
      padding: 1.5rem;
    }
    
    .modal-title {
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    
    .btn-close {
      filter: invert(1);
    }
    
    .product-btn {
      border: 2px solid #e0e7ff;
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      transition: 0.3s ease;
      background: white;
      color: #1e2e49;
      font-weight: 500;
    }
    
.product-btn {
  position: relative;
  overflow: hidden;
  transition: all 0.3s ease;
  border: 2px solid #3b5b92;
  background: white;
  color: #333;
  z-index: 1;
}

.product-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -75%;
  width: 50%;
  height: 100%;
  background: linear-gradient(
    120deg,
    rgba(255, 255, 255, 0.2) 0%,
    rgba(255, 255, 255, 0.5) 50%,
    rgba(255, 255, 255, 0.2) 100%
  );
  transform: skewX(-25deg);
  transition: all 0.5s ease;
}

.product-btn:hover::before {
  left: 130%;
}

.product-btn:hover,
.product-btn.selected {
  background: linear-gradient(135deg, #63b3ed, #4299e1);
  color: white;
  transform: scale(1.08);
  border-color: transparent;
  box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
}
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .game-card {
      animation: fadeIn 0.6s ease forwards;
      opacity: 0;
    }
    
    .game-card:nth-child(1) { animation-delay: 0.1s; }
    .game-card:nth-child(2) { animation-delay: 0.2s; }
    .game-card:nth-child(3) { animation-delay: 0.3s; }
    .game-card:nth-child(4) { animation-delay: 0.4s; }
    
    .form-control {
      border: 2px solid #1e2e49;
      border-radius: 8px;
      padding: 0.8rem;
      transition: 0.3s ease;
    }
    
    .form-control:focus {
      border-color: #1e2e49;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }
    
    .floating-close {
      position: absolute;
      right: 15px;
      top: 15px;
      
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      transition: 0.3s ease;
      z-index: 1000;
      border: 1px solid #e5e7eb;
      cursor: pointer;
    }

    .floating-close:hover {
      transform: rotate(90deg) scale(1.1);
      background: #ef4444;
      color: white;
      border-color: transparent;
    }

    #submitButton:disabled {
      background: #e0e7ff;
      border-color: #e0e7ff;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Tambahan Navbar & Footer */
    .navbar-custom {
      background: linear-gradient(135deg, #1e2e49 0%, #1e2e49 100%);
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.15);
    }
    
    .navbar-brand {
      font-weight: 700;
      color: white !important;
      letter-spacing: -0.5px;
    }
    
    .nav-link {
      color: rgba(255, 255, 255, 0.8) !important;
      font-weight: 500;
      transition: all 0.3s;
    }
    
    .nav-link:hover {
      color: white !important;
      transform: translateY(-2px);
    }
    
    .footer-custom {
      background: linear-gradient(135deg, #1e2e49 0%, #1e2e49 100%);
      color: white;
      margin-top: 5rem;
      padding: 2rem 0;
    }
    
    .footer-link {
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: all 0.3s;
    }
    
    .footer-link:hover {
      color: white;
      transform: translateX(3px);
    }
  </style>
</head>
<body>
  <!-- Navbar Baru -->
  <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
    <div class="container">
   <a class="navbar-brand" href="#">
  <img src="nav.gif" alt="GameStore" height="50">
</a>
    </div>
  </nav>

  <!-- Konten Utama (Tetap Sama) -->
  
  <div class="container py-5" style="margin-top: 80px;">
<h2 class="mb-5 text-center fw-bold text-white" style="font-size: 22px; line-height: 1.2; 
      letter-spacing: 1px; text-shadow: 0 4px 8px rgba(0,0,0,0.2); font-family: 'Roboto', sans-serif;">
  Selamat Datang di 
  <span style="color: white; text-decoration: underline;">Kevv'Store</span> 
  Tempat Topup Game Yang Murah, Aman, Terpercaya.
</h2>
<div class="row g-4" id="gameList"></div>
  <!-- Footer Baru -->
  <footer class="footer-custom">
    <div class="container">
      <div class="row text-center">
        <div class="col-md-6 mb-3 mb-md-0">
          <p class="mb-0">&copy; 2024 GameStore. All rights reserved</p>
        </div>
        <div class="col-md-6">
          <a href="#" class="footer-link mx-3">Syarat & Ketentuan</a>
          <a href="#" class="footer-link">Kebijakan Privasi</a>
          <a href="#" class="footer-link">Tentang Kami</a>
        </div>
      </div>
    </div>
  </footer>

<!-- Modal Order (dengan loading) -->
<div class="modal fade" id="orderModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="floating-close" data-bs-dismiss="modal">
        <i class="bi bi-x-lg"></i>
      </div>

      <!-- Loading Area -->
      <div id="popupLoading" class="text-center py-5">
        <img src="logo.png" alt="Logo" width="120" class="mb-3">
        <div class="progress mx-4" style="height: 10px;">
          <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" style="width: 100%"></div>
        </div>
      </div>

      <!-- Form Area -->
      <div id="popupForm" style="display: none;">
        <form onsubmit="submitOrder(event)">
          <div class="modal-header">
            <h5 class="modal-title" id="orderGameTitle">Order Game</h5>
          </div>
          <div class="modal-body px-4 pb-4">
            <div id="inputFields" class="mb-4"></div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Pilih Produk</label>
              <div id="productList" class="d-flex flex-wrap gap-2"></div>
            </div>
            <button type="submit" id="submitButton" class="btn btn-primary w-100 py-2 fw-bold mt-3" disabled>
              Konfirmasi Pesanan Kamu <i class="ms-2"></i>
            </button>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
  <!-- Script JS Asli (Tidak Diubah) -->
<script>
let games = [], products = [], selectedGame = null, selectedProduct = null;
const waSender = "6281538769551";

// Ambil data game tanpa cache
fetch('database.txt?v=' + new Date().getTime())
    .then(res => res.text())
    .then(text => {
        games = text.trim().split('\n').map(line => {
            if (line.startsWith('#')) return line;
            const [id, name, logo, format] = line.split('|');
            return { id: parseInt(id), name, logo, format };
        });
        
        renderGames();
    });

// Ambil data produk tanpa cache
fetch('pricelist.txt?v=' + new Date().getTime())
    .then(res => res.text())
    .then(text => {
        products = text.trim().split('\n').map(line => {
            const [gameId, name, price] = line.split('|');
            return { gameId: parseInt(gameId), name, price };
        });
    });

// Tampilkan daftar game
function renderGames() {
    const gameList = document.getElementById('gameList');
    gameList.innerHTML = '';
    let currentSection = '';

    games.forEach(game => {
        if (typeof game === 'string' && game.startsWith('#')) {
            currentSection = game.substring(1);
            const sectionTitle = document.createElement('h5');
            sectionTitle.className = 'mt-4 mb-3 fw-bold fs-5 text-white';
            sectionTitle.innerText = currentSection;
            gameList.appendChild(sectionTitle);

            const row = document.createElement('div');
            row.className = 'row g-3';
            row.setAttribute('data-section', currentSection);
            gameList.appendChild(row);
            return;
        }

        const row = gameList.querySelector(`div[data-section="${currentSection}"]`) || gameList;
        const col = document.createElement('div');
        col.className = 'col-6 col-md-3';
        col.innerHTML = `
            <div class="card game-card h-100" onclick="openOrder(${game.id})">
                <div class="card-header bg-transparent border-0">
                    <img src="img/${game.logo}" class="game-logo w-100" alt="${game.name}">
                </div>
                <div class="card-body text-center pt-0">
                    <h6 class="card-title">${game.name}</h6>
                </div>
            </div>`;
        row.appendChild(col);
    });
}

// Modal order
function openOrder(gameId) {
    selectedProduct = null;
    selectedGame = games.find(game => typeof game !== 'string' && game.id === gameId);
    if (!selectedGame) return;

    document.getElementById('orderGameTitle').innerText = selectedGame.name;
    document.getElementById('inputFields').innerHTML = '';
    document.getElementById('productList').innerHTML = '';
    document.getElementById('submitButton').disabled = true;

    const fields = selectedGame.format.split(',');
    fields.forEach(field => {
        const div = document.createElement('div');
        div.className = 'mb-3';
        div.innerHTML = `
            <label class="form-label">${field.toUpperCase()}</label>
            <input type="text" class="form-control" placeholder="${field}" required>
        `;
        document.getElementById('inputFields').appendChild(div);
    });

    const gameProducts = products.filter(p => p.gameId === selectedGame.id);
    gameProducts.forEach(product => {
        if (product.price.startsWith('dropdown:')) {
            const options = product.price.replace('dropdown:', '').split(',');
            const select = document.createElement('select');
            select.className = 'form-select mb-2';
            select.setAttribute('data-label', product.name);

            const label = document.createElement('label');
            label.className = 'form-label';
            label.innerText = product.name;

            options.forEach(opt => {
                const [text, value] = opt.includes('=') ? opt.split('=') : [opt, opt];
                const option = document.createElement('option');
                option.value = value;
                option.text = text;
                select.appendChild(option);
            });

            const div = document.createElement('div');
            div.className = 'mb-3';
            div.appendChild(label);
            div.appendChild(select);
            document.getElementById('inputFields').appendChild(div);
        } else {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'product-btn btn btn-outline-primary mb-2';
            btn.innerHTML = `${product.name} <small class="d-block opacity-75">Rp${product.price}</small>`;
            btn.onclick = () => {
                document.querySelectorAll('.product-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedProduct = product;
                document.getElementById('submitButton').disabled = false;
            };
            document.getElementById('productList').appendChild(btn);
        }
    });

    new bootstrap.Modal(document.getElementById('orderModal')).show();
}

// Submit order dengan konfirmasi popup
function submitOrder(event) {
    event.preventDefault();
    if (!selectedProduct) return alert('Pilih produk terlebih dahulu!');

    const inputs = document.querySelectorAll('.form-control');
    const selects = document.querySelectorAll('select');

    let message = `Order ${selectedGame.name}\nProduk: ${selectedProduct.name}\nHarga: Rp${selectedProduct.price}\n`;

    for (let input of inputs) {
        const label = input.placeholder;
        const value = input.value.trim();
        if (!value) return alert(`${label} wajib diisi!`);
        message += `${label}: ${value}\n`;
    }

    for (let select of selects) {
        const label = select.getAttribute('data-label');
        const value = select.value.trim();
        if (!value) return alert(`${label} wajib dipilih!`);
        message += `${label}: ${value}\n`;
    }

    document.getElementById('confirmText').innerText = message;
    const encodedMessage = encodeURIComponent(message);
    document.getElementById('confirmButton').href = `https://wa.me/${waSender}?text=${encodedMessage}`;
    new bootstrap.Modal(document.getElementById('confirmModal')).show();
}
</script>

  <!-- Bootstrap JS & Icons -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- Bootstrap Icons CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
<script>
  const orderModal = document.getElementById('orderModal');
  orderModal.addEventListener('show.bs.modal', () => {
    document.getElementById('popupLoading').style.display = 'block';
    document.getElementById('popupForm').style.display = 'none';

    // Delay untuk simulasi loading
    setTimeout(() => {
      document.getElementById('popupLoading').style.display = 'none';
      document.getElementById('popupForm').style.display = 'block';
    }, 1000); // 1 detik loading
  });
</script>
</body>
</html>
